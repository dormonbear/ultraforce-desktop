name: Release PR Body / 发布 PR 正文

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Release body regressions / 发布正文回归
        run: python -m unittest discover -s scripts -p 'check_release_pr_body_test.py'
      - name: Validate release envelope / 校验发布正文结构
        if: startsWith(github.head_ref, 'release-please--')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$RELEASE_PR_NUMBER" --repo "$GH_REPO" --json body --jq .body > "$RUNNER_TEMP/release-pr-body.md"
          python scripts/check_release_pr_body.py --body-file "$RUNNER_TEMP/release-pr-body.md"
