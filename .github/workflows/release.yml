name: Release

# Release Please maintains a release PR; merging it creates a tagged draft.
# Release Please 维护发布 PR；合并后创建带标签的草稿。
# Build and verify every asset before publishing the release and npm wrapper.
# 构建并验证全部产物后，才公开发布并发布 npm 包装器。
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Run only when Release Please creates a release. / 仅在 Release Please 创建发布时运行。
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest   # Apple Silicon (arm64)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest   # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify Release Draft and Tag / 验证发布草稿和标签
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: python scripts/verify_release_build.py --tag "$RELEASE_TAG"

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      # pnpm version comes from package.json `packageManager` (single source);
      # specifying `version:` here too makes action-setup@v4 error on a mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: desktop

      # Upload to the draft created by Release Please. / 上传至 Release Please 创建的草稿。
      - name: Build & upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sign updater bundles; the manifest is staged after all builds. / 签署更新包；全部构建完成后暂存清单。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # 额外产出 `uf-ost` MCP 服务器二进制，按 target triple 命名上传到同一 release，
      # 供 AI agent 免 cargo build 直接下载（README 的 MCP 安装说明引用这些 asset）。
      - name: Build & upload uf-ost MCP binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --locked --bin uf-ost ${{ matrix.args }}
          triple=$(echo "${{ matrix.args }}" | sed -n 's/.*--target \([^ ]*\).*/\1/p')
          if [ -z "$triple" ]; then
            triple=$(rustc -vV | sed -n 's/host: //p')
            dir="target/release"
          else
            dir="target/$triple/release"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$dir/uf-ost.exe" "uf-ost-$triple.exe"
            gh release upload "${{ needs.release-please.outputs.tag_name }}" "uf-ost-$triple.exe" --clobber
          else
            cp "$dir/uf-ost" "uf-ost-$triple"
            gh release upload "${{ needs.release-please.outputs.tag_name }}" "uf-ost-$triple" --clobber
          fi

  # Stage and validate every asset before publication. / 公开前暂存并验证全部产物。
  publish-updater:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Publish Complete Release / 发布完整版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          python scripts/stage_release.py --tag "$RELEASE_TAG"

  # Resume a verified current release when an earlier publication failed. / 先前发布失败时恢复已验证的当前版本。
  recover-release:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.recover.outputs.needed }}
      tag: ${{ steps.recover.outputs.tag }}
      sha: ${{ steps.recover.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recover Verified Release / 恢复已验证发布
        id: recover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/recover_release.py --output "$GITHUB_OUTPUT"

  # Publish the exact tagged npm package only when the registry lacks it. / 仅在注册表缺失时发布精确标签对应的 npm 包。
  recover-npm:
    needs: recover-release
    if: ${{ !cancelled() && needs.recover-release.result == 'success' && needs.recover-release.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.recover-release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Publish @dormon/ultraforce-mcp
        working-directory: npm
        run: npm publish --provenance --access public

  # Publish the npm wrapper after the release is public; installation downloads its binary.
  # 公开发布后再发布 npm 包装器；安装时会下载其中的二进制文件。
  # Trusted Publishing uses OIDC and includes provenance. / 可信发布使用 OIDC 并包含来源证明。
  publish-npm:
    needs: [release-please, build, publish-updater]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing（job 级 permissions 会覆盖顶层，需写全）
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # trusted publishing 要求 Node >= 22.14
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # 要求 npm >= 11.5.1
      - name: Publish @dormon/ultraforce-mcp
        working-directory: npm
        run: npm publish --provenance --access public

  # Keep queued releases waiting until npm has propagated. / 等待 npm 同步完成后再继续排队的发布。
  verify-npm-propagation:
    needs: [publish-npm, recover-npm]
    if: >-
      ${{ !cancelled() &&
          (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'failure' ||
           needs.recover-npm.result == 'success' || needs.recover-npm.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify npm propagation / 验证 npm 发布同步
        run: python scripts/wait_npm_version.py
