name: CI

on:
  pull_request:

jobs:
  control:
    name: Windows synthetic control / Windows 合成对照
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install test dependencies / 安装测试依赖
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Prepare synthetic cases / 准备合成用例
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .early-resource-control | Out-Null
          @'
          import { test, expect } from '@playwright/test';
          test('intentional failure / 故意失败', () => expect(1).toBe(2));
          test('later case runs / 后续用例运行', () => console.log('CONTROL_CONTINUED'));
          '@ | Set-Content -LiteralPath .early-resource-control/control.spec.js -Encoding utf8
          @'
          export default { testDir: './.early-resource-control', testMatch: 'control.spec.js', workers: 1, retries: 0 };
          '@ | Set-Content -LiteralPath early-resource-control.config.mjs -Encoding utf8
      - name: Run synthetic failures / 运行合成失败用例
        id: synthetic
        working-directory: desktop
        env:
          PERF_PROD: '1'
        run: pnpm exec playwright test --config=early-resource-control.config.mjs "--reporter=line,./e2e/windows-resource-reporter.mjs"
      - name: Confirm the failure path / 确认失败路径
        if: ${{ failure() && steps.synthetic.outcome == 'failure' }}
        run: python -c "print('CONTROL_STEP_REACHED')"
