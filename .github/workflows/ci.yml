name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}) / 测试
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Architecture guardrails
        shell: bash
        run: ./scripts/check-arch.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Release version alignment / 发布版本一致性
        run: python scripts/check_release_versions.py

      - name: Release metadata regressions / 发布元信息回归测试
        run: python -m unittest discover -s scripts -p '*_test.py'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Frontend install
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: desktop
        run: pnpm exec tsc --noEmit

      - name: Built syntax checker regressions / 构建语法检查器回归
        working-directory: desktop
        run: node --test scripts/check-built-syntax.test.mjs

      - name: Frontend tests
        working-directory: desktop
        run: pnpm exec vitest run --coverage

      - name: Frontend coverage report / 前端覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-coverage-${{ runner.os }}
          path: desktop/coverage/
          retention-days: 14

      - name: Lint
        working-directory: desktop
        run: pnpm exec oxlint src

      - name: Install test browser / 安装测试浏览器
        working-directory: desktop
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Editor and localization regressions / 编辑器与本地化回归
        working-directory: desktop
        env:
          PERF_PROD: '1'
        run: pnpm exec playwright test e2e/editor-input-integrity.spec.ts e2e/setup-i18n.spec.ts e2e/org-i18n.spec.ts e2e/soql-i18n.spec.ts e2e/apex-org-diagnostics.spec.ts e2e/apex-i18n.spec.ts e2e/debug-config-org.spec.ts e2e/self-trace-org.spec.ts e2e/log-source-mapping.spec.ts --reporter=line

      - name: Built browser syntax / 构建浏览器语法
        working-directory: desktop
        run: node scripts/check-built-syntax.mjs

      - name: Browser failure evidence / 浏览器失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-input-${{ runner.os }}
          path: desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Rust tests
        if: runner.os != 'macOS'
        run: cargo test --locked --workspace

      - name: Rust coverage tooling / Rust 覆盖率工具
        if: runner.os == 'macOS'
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version '=0.9.1' --locked

      - name: Rust coverage and floors / Rust 覆盖率及门槛
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p target/rust-coverage
          cargo llvm-cov --locked --workspace --json --summary-only --output-path target/rust-coverage/summary.json
          cargo llvm-cov report --lcov --output-path target/rust-coverage/lcov.info
          python scripts/check_rust_coverage.py --summary-file target/rust-coverage/summary.json
          cargo test --locked --workspace --doc

      - name: Rust coverage report / Rust 覆盖率报告
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ runner.os }}
          path: target/rust-coverage/
          retention-days: 14

      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings
